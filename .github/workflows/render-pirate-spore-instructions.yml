name: Render pirate spore instructions

on:
  pull_request:
    types: [synchronize]
    paths:
      - examples/spore/render_pirate_spore_instructions.py
      - .github/workflows/render-pirate-spore-instructions.yml

permissions:
  contents: write

jobs:
  render:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Install renderer dependency
        run: python -m pip install --disable-pip-version-check pillow
      - name: Render and verify the readable carrier
        run: python examples/spore/render_pirate_spore_instructions.py
      - name: Commit the repaired PNG
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/spore/pirate_spore.png
          if git diff --cached --quiet; then
            echo "PNG already rendered"
          else
            git commit -m "Render readable spore boot instructions"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          fi
