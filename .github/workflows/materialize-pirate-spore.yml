name: Materialize pirate spore

on:
  push:
    branches:
      - agent/add-pirate-spore
    paths:
      - examples/spore/materialize_pirate_spore.py
      - .github/workflows/materialize-pirate-spore.yml
  pull_request:
    types: [synchronize]
    paths:
      - examples/spore/materialize_pirate_spore.py
      - .github/workflows/materialize-pirate-spore.yml

permissions:
  contents: write

jobs:
  materialize:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Check out the source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build the Grimoire spore
        run: python examples/spore/materialize_pirate_spore.py examples/spore/pirate_spore.png

      - name: Commit the binary carrier
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add examples/spore/pirate_spore.png
          git commit -m "Add pirate spore"
          git push origin HEAD:${{ github.head_ref || github.ref_name }}
